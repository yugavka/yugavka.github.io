name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh Kaggle places
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            python -m pip install kaggle==2.2.5
            python scripts/update_kaggle_ranks.py
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::error::Set the KAGGLE_API_TOKEN repository secret to refresh leaderboard places."
            exit 1
          else
            echo "KAGGLE_API_TOKEN is not set; using the checked-in leaderboard snapshot."
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
